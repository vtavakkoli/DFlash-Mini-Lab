name: CPU benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docker-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Build deterministic CPU-only image
        run: docker build -t dflash-mini-lab .

      - name: Optimize DFlash5 fused anchors
        run: |
          rm -rf ci-sweep && mkdir -p ci-sweep
          i=0
          for cfg in "0.50 0.00" "1.00 0.00" "1.50 0.00" "1.00 0.10" "1.00 0.25"; do
            set -- $cfg
            weight="$1"
            margin="$2"
            out="ci-sweep/run-${i}"
            mkdir -p "$out"
            docker run --rm \
              -e CPU_THREADS=1 \
              -e OPENBLAS_NUM_THREADS=1 \
              -e OMP_NUM_THREADS=1 \
              -e MKL_NUM_THREADS=1 \
              -v "$PWD/$out:/app/reports" \
              dflash-mini-lab \
              --output-dir /app/reports --tokens 12 --warmups 1 --repeats 3 --top-k 8 --mobs-refine-passes 0 \
              --jump-weight 0.5 --fused-jump-weight "$weight" --fused-jump-min-margin "$margin"
            printf '%s %s\n' "$weight" "$margin" > "$out/config.txt"
            i=$((i+1))
          done
          python - <<'PY'
          import glob, json, os
          candidates=[]
          for path in sorted(glob.glob('ci-sweep/run-*/benchmark.json')):
              d=json.load(open(path))
              weight, margin=open(os.path.join(os.path.dirname(path),'config.txt')).read().split()
              d2=d['summary']['dflash2']
              d5=d['summary']['dflash5_fused_jump_mobs']
              valid=(d5['all_exact'] and d5['mean_jump_forward_passes']==0 and d5['mean_total_guidance_scores'] < d2['mean_selector_pair_scores'])
              candidates.append({
                  'weight':float(weight),'margin':float(margin),'valid':valid,
                  'tokens_per_second_median':d5['tokens_per_second_median'],
                  'acceptance_rate':d5['mean_acceptance_rate'],
                  'tokens_per_target_pass':d5['mean_tokens_per_target_pass'],
                  'guidance_scores':d5['mean_total_guidance_scores'],
              })
          valid=[x for x in candidates if x['valid']]
          if not valid:
              raise SystemExit('No valid DFlash5 optimization candidate')
          best=max(valid,key=lambda x:x['tokens_per_second_median'])
          json.dump({'candidates':candidates,'best':best},open('ci-sweep/dflash5-sweep.json','w'),indent=2)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"D5_WEIGHT={best['weight']}\n")
              f.write(f"D5_MARGIN={best['margin']}\n")
          print(json.dumps({'best':best,'candidates':candidates},indent=2))
          PY

      - name: Run reproducible benchmark
        run: |
          rm -rf ci-reports && mkdir -p ci-reports
          docker run --rm \
            -e CPU_THREADS=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e OMP_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            -v "$PWD/ci-reports:/app/reports" \
            dflash-mini-lab \
            --output-dir /app/reports --tokens 24 --warmups 1 --repeats 5 --top-k 8 --mobs-refine-passes 0 \
            --jump-weight 0.5 --fused-jump-weight "$D5_WEIGHT" --fused-jump-min-margin "$D5_MARGIN"
          cp ci-sweep/dflash5-sweep.json ci-reports/dflash5-sweep.json

      - name: Validate report, exactness and optimized fused path
        run: |
          test -s ci-reports/report.html
          test -s ci-reports/benchmark.json
          test -s ci-reports/dflash5-sweep.json
          test -s ci-reports/speedup.gif
          test -s ci-reports/architecture.gif
          python - <<'PY'
          import json
          d=json.load(open('ci-reports/benchmark.json'))
          for method in ('normal','dflash','dflash2','dflash3_mobs','dflash4_jump_mobs','dflash5_fused_jump_mobs'):
              assert d['summary'][method]['all_exact'], method
          d2=d['summary']['dflash2']; d5=d['summary']['dflash5_fused_jump_mobs']
          assert d['summary']['dflash4_jump_mobs']['mean_jump_forward_passes'] > 0
          assert d5['mean_jump_forward_passes'] == 0
          assert d5['mean_jump_candidate_scores'] > 0
          assert d5['mean_fused_anchor_uses'] > 0
          assert d['summary']['dflash3_mobs']['mean_selector_pair_scores'] < d2['mean_selector_pair_scores']
          assert d['summary']['dflash4_jump_mobs']['mean_total_guidance_scores'] < d2['mean_selector_pair_scores']
          assert d5['mean_total_guidance_scores'] < d2['mean_selector_pair_scores']
          print(json.dumps(d['summary'], indent=2))
          PY

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dflash-cpu-report
          path: ci-reports/

      - name: Prepare verified Pages site
        if: github.event_name != 'pull_request'
        run: |
          rm -rf pages && mkdir -p pages
          cp ci-reports/report.html pages/index.html
          cp ci-reports/report.html pages/report.html
          cp ci-reports/benchmark.json pages/benchmark.json
          cp ci-reports/dflash5-sweep.json pages/dflash5-sweep.json
          cp ci-reports/speedup.gif pages/speedup.gif
          cp ci-reports/architecture.gif pages/architecture.gif
          touch pages/.nojekyll
          cat > pages/verification.json <<EOF
          {
            "verified": true,
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "workflow": "${GITHUB_WORKFLOW}",
            "repository": "${GITHUB_REPOSITORY}",
            "includes_dflash3_mobs": true,
            "includes_dflash4_jump_mobs": true,
            "includes_dflash5_fused_jump_mobs": true,
            "dflash5_optimized": true
          }
          EOF

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: docker-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified benchmark to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
