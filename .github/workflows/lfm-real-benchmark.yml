name: LFM2.5 All-12 CPU benchmark

on:
  pull_request:
    paths:
      - "Dockerfile.lfm"
      - "real_benchmarks/**"
      - "src/dflash_mini_lab/lfm_*.py"
      - "src/dflash_mini_lab/v11_*.py"
      - "src/dflash_mini_lab/v12_*.py"
      - ".github/workflows/lfm-real-benchmark.yml"
      - "pyproject.toml"
      - "README.md"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "Dockerfile.lfm"
      - "real_benchmarks/**"
      - "src/dflash_mini_lab/lfm_*.py"
      - "src/dflash_mini_lab/v11_*.py"
      - "src/dflash_mini_lab/v12_*.py"
      - ".github/workflows/lfm-real-benchmark.yml"
      - "pyproject.toml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "lfm25-all12-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lfm25-all12:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Restore LFM2.5 Hugging Face cache
        uses: actions/cache@v4
        with:
          path: hf-cache
          key: lfm25-350m-base-${{ runner.os }}-transformers5161-v1

      - name: Build canonical LFM2.5 CPU image
        run: |
          docker build -f Dockerfile.lfm -t dflash-lfm25 .
          docker run --rm dflash-lfm25 python -m py_compile \
            /app/src/dflash_mini_lab/lfm_all12_benchmark.py \
            /app/src/dflash_mini_lab/lfm_benchmark.py \
            /app/src/dflash_mini_lab/lfm_showcase.py \
            /app/src/dflash_mini_lab/lfm_dspark.py \
            /app/src/dflash_mini_lab/lfm_v10.py \
            /app/src/dflash_mini_lab/lfm_v9v10_benchmark.py \
            /app/src/dflash_mini_lab/v11_benchmark.py \
            /app/src/dflash_mini_lab/v11_boltzmann_mobs.py \
            /app/src/dflash_mini_lab/v12_parareal.py \
            /app/src/dflash_mini_lab/v12_prepare.py \
            /app/src/dflash_mini_lab/v12_benchmark.py

      - name: Prepare frozen LFM2.5 DFlash backbone
        run: |
          mkdir -p hf-cache lfm-artifacts
          docker run --rm \
            -e HF_HOME=/cache \
            -e CPU_THREADS=2 -e OMP_NUM_THREADS=2 -e MKL_NUM_THREADS=2 -e OPENBLAS_NUM_THREADS=2 \
            -v "$PWD/hf-cache:/cache" \
            -v "$PWD/lfm-artifacts:/app/lfm-artifacts" \
            dflash-lfm25 \
            python -m dflash_mini_lab.lfm_prepare \
              --model-id LiquidAI/LFM2.5-350M-Base \
              --output-dir /app/lfm-artifacts \
              --max-seed-count 40 \
              --generation-tokens 32 \
              --top-candidate-k 32 \
              --candidate-limit 2048 \
              --drafter-steps 300 \
              --selector-steps 180 \
              --jump-steps 120 \
              --fused-steps 180 \
              --cpu-threads 2

      - name: Prepare V9 DSpark-Lite heads
        run: |
          docker run --rm \
            -e HF_HOME=/cache -e TRANSFORMERS_OFFLINE=1 -e HF_HUB_OFFLINE=1 \
            -e CPU_THREADS=2 -e OMP_NUM_THREADS=2 -e MKL_NUM_THREADS=2 -e OPENBLAS_NUM_THREADS=2 \
            -v "$PWD/hf-cache:/cache" \
            -v "$PWD/lfm-artifacts:/app/lfm-artifacts" \
            dflash-lfm25 \
            python -m dflash_mini_lab.lfm_dspark \
              --aux /app/lfm-artifacts/lfm_aux.pt \
              --output /app/lfm-artifacts/lfm_dspark.pt \
              --seeds /app/real_benchmarks/train_seeds.json \
              --max-seed-count 40 \
              --generation-tokens 32 \
              --markov-rank 16 \
              --markov-steps 180 \
              --confidence-steps 100 \
              --batch-size 64 \
              --cpu-threads 2

      - name: Prepare V12 PARAREAL linear residual model
        run: |
          docker run --rm \
            -e HF_HOME=/cache -e TRANSFORMERS_OFFLINE=1 -e HF_HUB_OFFLINE=1 \
            -e CPU_THREADS=2 -e OMP_NUM_THREADS=2 -e MKL_NUM_THREADS=2 -e OPENBLAS_NUM_THREADS=2 \
            -v "$PWD/hf-cache:/cache" \
            -v "$PWD/lfm-artifacts:/app/lfm-artifacts" \
            dflash-lfm25 \
            python -m dflash_mini_lab.v12_prepare \
              --aux /app/lfm-artifacts/lfm_aux.pt \
              --output /app/lfm-artifacts/v12_parareal.json \
              --seeds /app/real_benchmarks/train_seeds.json \
              --max-seed-count 24 \
              --generation-tokens 24 \
              --top-k 8 \
              --correction-rounds 2 \
              --damping 0.75 \
              --holdout-fraction 0.20 \
              --cpu-threads 2

      - name: Run Normal + 12 speculative methods on LFM2.5
        run: |
          mkdir -p lfm-reports
          docker run --rm \
            -e HF_HOME=/cache -e TRANSFORMERS_OFFLINE=1 -e HF_HUB_OFFLINE=1 \
            -e CPU_THREADS=2 -e OMP_NUM_THREADS=2 -e MKL_NUM_THREADS=2 -e OPENBLAS_NUM_THREADS=2 \
            -v "$PWD/hf-cache:/cache" \
            -v "$PWD/lfm-artifacts:/app/lfm-artifacts:ro" \
            -v "$PWD/lfm-reports:/app/lfm-reports" \
            dflash-lfm25 \
            python -m dflash_mini_lab.lfm_all12_benchmark \
              --aux /app/lfm-artifacts/lfm_aux.pt \
              --dspark /app/lfm-artifacts/lfm_dspark.pt \
              --v12-model /app/lfm-artifacts/v12_parareal.json \
              --prompts /app/real_benchmarks/prompts.json \
              --calibration-prompts /app/real_benchmarks/calibration_prompts.json \
              --output-dir /app/lfm-reports \
              --tokens 24 \
              --repeats 3 \
              --prompt-limit 6 \
              --calibration-tokens 8 \
              --calibration-prompt-limit 3 \
              --top-k 8 \
              --jump-weight 0.5 \
              --fused-weight 1.0 \
              --boltzmann-temperature 0.15 \
              --bmobs-temperature 0.35 \
              --cpu-threads 2 \
              --dtype float32

      - name: Validate one-model all-12 evidence
        run: |
          test -s lfm-artifacts/lfm_aux.pt
          test -s lfm-artifacts/lfm_dspark.pt
          test -s lfm-artifacts/v12_parareal.json
          test -s lfm-reports/benchmark.json
          test -s lfm-reports/report.html
          grep -q "LFM2.5 All-12 Study" lfm-reports/report.html
          grep -q "Speedup versus normal decoding" lfm-reports/report.html
          grep -q "Mechanism simulation" lfm-reports/report.html
          grep -q "V12 PARAREAL" lfm-reports/report.html
          ! grep -qi "Qwen" lfm-reports/report.html
          ! grep -qi "EAGLE" lfm-reports/report.html
          python - <<'PY'
          import json
          d=json.load(open('lfm-reports/benchmark.json'))
          assert d['model']['id']=='LiquidAI/LFM2.5-350M-Base'
          expected=(
            'normal','dflash','dflash2','dflash3_mobs','dflash4_jump_mobs',
            'dflash5_fused_jump_mobs','dflash6_boltzmann','dflash6_bmobs',
            'dflash7_act','dspark_v9','boltzmann_v10',
            'boltzmann_gated_mobs_v11','parareal_linear_v12'
          )
          assert len(expected)==13
          assert len(d['summary'])==13
          for method in expected:
              s=d['summary'][method]
              assert s['all_exact'], method
              assert s['tokens_per_second_median']>0, method
              assert s['speedup_vs_normal']>0, method
          assert d['config']['prompt_count']==6
          assert d['config']['repeats']==3
          assert d['selected_settings']['v12']['correction_rounds']==2
          print(json.dumps({'winner':d['winner'],'summary':d['summary']},indent=2))
          PY

      - name: Upload canonical LFM2.5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lfm25-350m-all12
          path: |
            lfm-reports/
            lfm-artifacts/manifest.json
            lfm-artifacts/distillation.json
            lfm-artifacts/v12_parareal.json
          retention-days: 30

      - name: Publish benchmark summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('lfm-reports/benchmark.json'))
          print('# LFM2.5-350M — Normal + 12 speculative methods')
          print(f"Fastest speculative method: **{d['winner']}**")
          print('| Method | tok/s | vs normal | acceptance | target calls | exact |')
          print('|---|---:|---:|---:|---:|:---:|')
          for name, s in sorted(d['summary'].items(), key=lambda x:x[1]['speedup_vs_normal'], reverse=True):
              print(f"| {name} | {s['tokens_per_second_median']:.3f} | {s['speedup_vs_normal']:.3f}x | {100*s['mean_acceptance_rate']:.1f}% | {s['mean_target_forward_passes']:.2f} | {'yes' if s['all_exact'] else 'NO'} |")
          PY

      - name: Prepare LFM2.5-only GitHub Pages site
        if: github.event_name != 'pull_request'
        run: |
          rm -rf pages
          mkdir -p pages
          cp lfm-reports/report.html pages/index.html
          cp lfm-reports/benchmark.json pages/benchmark.json
          touch pages/.nojekyll

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: lfm25-all12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy LFM2.5 All-12 study
        id: deployment
        uses: actions/deploy-pages@v4
