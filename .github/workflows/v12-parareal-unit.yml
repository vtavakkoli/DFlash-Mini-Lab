name: V12 Parareal unit tests

on:
  pull_request:
    paths:
      - "src/dflash_mini_lab/v12_*.py"
      - "tests/test_v12_parareal.py"
      - "pyproject.toml"
      - ".github/workflows/v12-parareal-unit.yml"
  push:
    branches: [main]
    paths:
      - "src/dflash_mini_lab/v12_*.py"
      - "tests/test_v12_parareal.py"
      - "pyproject.toml"
      - ".github/workflows/v12-parareal-unit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install compact test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run V12 numerical regression tests
        run: pytest -q tests/test_v12_parareal.py

      - name: Validate package metadata
        run: |
          python - <<'PY'
          import dflash_mini_lab
          from dflash_mini_lab.v12_parareal import FEATURE_NAMES, V12Config

          assert dflash_mini_lab.__version__ == "1.3.0"
          assert len(FEATURE_NAMES) == 8
          cfg = V12Config()
          assert cfg.correction_rounds == 2
          assert cfg.top_k == 8
          print("DFlash12-PARAREAL metadata contract OK")
          PY
