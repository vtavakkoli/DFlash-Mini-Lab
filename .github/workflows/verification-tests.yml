name: Exact verifier regression tests

on:
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", "run_cpu.py", "run_gpu.py", ".github/workflows/verification-tests.yml"]
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", "run_cpu.py", "run_gpu.py", ".github/workflows/verification-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 transformers==5.16.1 pytest==9.0.2
      - run: python -m pytest -q
