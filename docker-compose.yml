services:
  benchmark:
    build:
      context: .
    environment:
      CPU_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - ./reports:/app/reports
    command: ["--output-dir", "/app/reports", "--tokens", "24", "--warmups", "1", "--repeats", "3"]

  test-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    gpus: all
    environment:
      HF_HOME: /cache
      CUDA_DEVICE: "${CUDA_DEVICE:-0}"
      LFM_GPU_DTYPE: "${LFM_GPU_DTYPE:-float16}"
      LFM_ALLOW_TF32: "${LFM_ALLOW_TF32:-1}"
      CPU_THREADS: "${CPU_THREADS:-4}"
      OMP_NUM_THREADS: "${CPU_THREADS:-4}"
      MKL_NUM_THREADS: "${CPU_THREADS:-4}"
      OPENBLAS_NUM_THREADS: "${CPU_THREADS:-4}"
      GPU_TOKENS: "${GPU_TOKENS:-24}"
      GPU_REPEATS: "${GPU_REPEATS:-3}"
      GPU_PROMPT_LIMIT: "${GPU_PROMPT_LIMIT:-6}"
      GPU_CALIBRATION_TOKENS: "${GPU_CALIBRATION_TOKENS:-8}"
      GPU_CALIBRATION_PROMPT_LIMIT: "${GPU_CALIBRATION_PROMPT_LIMIT:-3}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./hf-cache:/cache
      - ./gpu-artifacts:/app/lfm-artifacts
      - ./gpu-reports:/app/gpu-reports
    command: ["/app/scripts/test_gpu.sh"]
