services:
  benchmark:
    build:
      context: .
    environment:
      CPU_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - ./reports:/app/reports
    command: ["--output-dir", "/app/reports", "--tokens", "24", "--warmups", "1", "--repeats", "3"]
