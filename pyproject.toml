[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dflash-mini-lab"
version = "1.5.0"
description = "Reproducible LFM2.5 CPU benchmark lab for fourteen speculative-decoding mechanisms through V13 MinOp and V14 Simple PARAREAL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vahid Tavakkoli"}]
dependencies = [
  "numpy==2.3.5",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
real = ["transformers==5.16.1"]

[project.scripts]
dflash-mini-lab = "dflash_mini_lab.cli:main"
dflash-lfm-prepare = "dflash_mini_lab.lfm_prepare:main"
dflash-lfm-benchmark = "dflash_mini_lab.lfm_all14_benchmark:main"
dflash-qwen-prepare = "dflash_mini_lab.qwen_prepare:main"
dflash-qwen-benchmark = "dflash_mini_lab.qwen_cli:main"
dflash-v12-prepare = "dflash_mini_lab.v12_prepare:main"
dflash-v12-benchmark = "dflash_mini_lab.v12_benchmark:main"
dflash-v14-prepare = "dflash_mini_lab.v14_prepare:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
